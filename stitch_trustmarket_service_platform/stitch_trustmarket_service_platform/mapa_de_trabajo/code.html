<script>
    // Database of beautiful client offers on the map
    const offers = [
        {
            id: 1,
            clientName: "Elena Rodríguez",
            clientAvatar: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=256",
            serviceName: "Diseño de Logotipo & Identidad",
            address: "Calle de Serrano, 45, Madrid",
            distance: "1.2 km",
            budget: "$2,448.00 USD",
            icon: "palette",
            chatUrl: "../chat_negociaci_n_profesional_1/code.html"
        },
        {
            id: 2,
            clientName: "Valeria Santos",
            clientAvatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuCOaqIQiuVhJseS3SQ5XjIOoQBb68yVPIoqkzZ4pFfgM9xTk1TmOwo3iw1qTVa132uKZngmPSUpRNA0-aNekMsP7yCNe0WYGFwfe4KBg1cVYjAh1rBYRVTjlBjUoNQClfnuf11xQdXs0Ni6eMDWjnBg-C1Wl3u7ISVcwiTiOj_xCZPIblHt5qTai9KniWnBW3GIZpMd7JDYwal5C_tNtq7xXTOCk0JqEBebntnAGNeBuUzkom_qcbrcG2Au9xu2qKIMrcURniDzAg",
            serviceName: "Diseño de Interiores & Planos",
            address: "Avenida de América, 18, Madrid",
            distance: "2.5 km",
            budget: "$3,500.00 USD",
            icon: "home_work",
            chatUrl: "../chat_de_negociaci_n_pro/code.html"
        },
        {
            id: 3,
            clientName: "Lucía Fernández",
            clientAvatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=256",
            serviceName: "Consultoría de Desarrollo Web",
            address: "Paseo de la Castellana, 102, Madrid",
            distance: "0.8 km",
            budget: "$1,800.00 USD",
            icon: "terminal",
            chatUrl: "../chat_negociaci_n_profesional_1/code.html"
        }
    ];

    let selectedOfferId = 1;
    let acceptedJobs = {};

    // Load states on boot
    function loadState() {
        const storedAccepted = localStorage.getItem('trustmarket_accepted_jobs');
        if (storedAccepted) {
            acceptedJobs = JSON.parse(storedAccepted);
        }
        
        // Update pin badges based on stored acceptance
        offers.forEach(offer => {
            updatePinBadge(offer.id);
        });
    }

    // Save states to localStorage
    function saveState() {
        localStorage.setItem('trustmarket_accepted_jobs', JSON.stringify(acceptedJobs));
    }

    // Update checkmark badge on a map pin
    function updatePinBadge(id) {
        const badge = document.getElementById(`pin-check-${id}`);
        const core = document.getElementById(`pin-core-${id}`);
        
        if (badge) {
            if (acceptedJobs[id]) {
                badge.classList.remove('opacity-0', 'scale-50');
                badge.classList.add('opacity-100', 'scale-100');
                if (core) {
                    core.classList.add('pin-accepted');
                    core.classList.remove('text-pink-400');
                    core.classList.add('text-emerald-500');
                }
            } else {
                badge.classList.add('opacity-0', 'scale-50');
                badge.classList.remove('opacity-100', 'scale-100');
                if (core) {
                    core.classList.remove('pin-accepted');
                    core.classList.add('text-pink-400');
                    core.classList.remove('text-emerald-500');
                }
            }
        }
    }

    // Show toast alerts in style
    function showToast(text, isError = false) {
        const toast = document.getElementById('toast-alert');
        const toastText = document.getElementById('toast-text');
        const iconContainer = document.getElementById('toast-icon-container');
        const icon = document.getElementById('toast-icon');

        toastText.textContent = text;
        if (isError) {
            iconContainer.className = "w-6 h-6 rounded-full bg-rose-500 flex items-center justify-center text-white";
            icon.textContent = "error";
        } else {
            iconContainer.className = "w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white";
            icon.textContent = "check";
        }

        toast.classList.remove('-translate-y-24', 'opacity-0', 'pointer-events-none');
        toast.classList.add('translate-y-0', 'opacity-100');

        setTimeout(() => {
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('-translate-y-24', 'opacity-0', 'pointer-events-none');
        }, 4000);
    }

    // Confetti explosion animation for accept button
    function explodeConfetti(e) {
        const rect = e.target.getBoundingClientRect();
        const xCenter = rect.left + rect.width / 2;
        const yCenter = rect.top + rect.height / 2;
        
        const colors = ['#ec4899', '#f472b6', '#10b981', '#34d399', '#3b82f6', '#fbbf24'];
        
        for (let i = 0; i < 30; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Random destinations
            const angle = Math.random() * Math.PI * 2;
            const distance = 40 + Math.random() * 90;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            
            sparkle.style.setProperty('--x', `${x}px`);
            sparkle.style.setProperty('--y', `${y}px`);
            
            // Position at center of button click
            sparkle.style.left = `${xCenter + window.scrollX - 5}px`;
            sparkle.style.top = `${yCenter + window.scrollY - 5}px`;
            
            document.body.appendChild(sparkle);
            
            // Clean up
            setTimeout(() => {
                sparkle.remove();
            }, 800);
        }
    }

    // Accept Job action
    function acceptJob(id, event) {
        if (event) {
            explodeConfetti(event);
        }
        
        acceptedJobs[id] = true;
        saveState();
        updatePinBadge(id);
        
        const offer = offers.find(o => o.id === id);
        
        // Show celebration feedback
        showToast(`¡Trabajo de ${offer.clientName} aceptado con éxito!`);
        
        // Re-render card with updated actions
        setTimeout(() => {
            renderCard(id);
        }, 150);
    }

    // Select offer and update UI
    function selectOffer(id) {
        selectedOfferId = id;
        
        // Manage active classes on pins
        offers.forEach(offer => {
            const pin = document.getElementById(`pin-${offer.id}`);
            if (pin) {
                if (offer.id === id) {
                    pin.classList.add('pin-active');
                    pin.style.zIndex = "30";
                } else {
                    pin.classList.remove('pin-active');
                    pin.style.zIndex = "10";
                }
            }
        });

        renderCard(id);
    }

    // Render card based on state
    function renderCard(id) {
        const offer = offers.find(o => o.id === id);
        if (!offer) return;

        const isAccepted = acceptedJobs[id] || false;
        const cardContainer = document.getElementById('floating-card');
        
        // Re-apply appearance animation
        cardContainer.classList.remove('card-change');
        void cardContainer.offsetWidth; // Trigger reflow
        cardContainer.classList.add('card-change');

        let actionButtons = "";
        let badgeHtml = "";

        if (isAccepted) {
            badgeHtml = `
                <span class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 border border-emerald-100 animate-pulse">
                    <span class="material-symbols-outlined text-[12px] font-black">check_circle</span>
                    Trabajo Aceptado
                </span>
            `;
            actionButtons = `
                <button onclick="showRoute(${offer.id})" class="flex-1 bg-sky-50 text-sky-600 font-bold py-3 rounded-full hover:bg-sky-100 transition-all flex items-center justify-center gap-2 active:scale-95 border border-sky-100/50">
                    <span class="material-symbols-outlined text-[18px]" data-icon="directions">directions</span>
                    Ruta
                </button>
                <button onclick="goToChat(${offer.id})" class="flex-[1.5] bg-gradient-to-r from-pink-500 to-pink-600 text-white font-bold py-3 rounded-full hover:from-pink-600 hover:to-pink-700 transition-all flex items-center justify-center gap-2 active:scale-95 shadow-md shadow-pink-100">
                    <span class="material-symbols-outlined text-[18px]" data-icon="chat">chat</span>
                    Chatear (Presupuesto)
                </button>
            `;
        } else {
            badgeHtml = `
                <span class="bg-pink-50 text-pink-500 px-3 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 border border-pink-100/30">
                    Oferta Disponible
                </span>
            `;
            actionButtons = `
                <button onclick="goToChat(${offer.id})" class="flex-1 bg-pink-50/50 text-pink-400 font-bold py-3 rounded-full hover:bg-pink-100 transition-all flex items-center justify-center gap-2 active:scale-95 border border-pink-100/40">
                    <span class="material-symbols-outlined text-[18px]" data-icon="chat">chat</span>
                    Mensaje / Discutir
                </button>
                <button onclick="acceptJob(${offer.id}, event)" class="flex-[1.5] bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold py-3 rounded-full hover:from-emerald-600 hover:to-emerald-700 transition-all flex items-center justify-center gap-2 active:scale-95 shadow-md shadow-emerald-100">
                    <span class="material-symbols-outlined text-[18px]" data-icon="handshake">handshake</span>
                    Aceptar Trabajo
                </button>
            `;
        }

        cardContainer.innerHTML = `
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-[0_20px_50px_rgba(15,23,42,0.12)] border border-slate-100 dark:border-slate-800/80">
                <div class="flex items-center gap-4">
                    <!-- Client Avatar with styled frame -->
                    <div class="relative">
                        <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-pink-100 dark:border-slate-800 shadow-sm">
                            <img alt="${offer.clientName}" class="w-full h-full object-cover" src="${offer.clientAvatar}"/>
                        </div>
                        <div class="absolute -bottom-1.5 -right-1.5 w-6 h-6 bg-pink-50 dark:bg-pink-900/40 text-pink-500 dark:text-pink-300 rounded-full flex items-center justify-center shadow-sm border border-white dark:border-slate-900">
                            <span class="material-symbols-outlined text-[14px] font-bold" data-icon="${offer.icon}">${offer.icon}</span>
                        </div>
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <div class="min-w-0">
                                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base truncate">${offer.clientName}</h3>
                                <p class="text-xs font-semibold text-slate-400 dark:text-slate-500 truncate mt-0.5">${offer.serviceName}</p>
                            </div>
                            <span class="bg-sky-50 dark:bg-slate-800 text-sky-600 dark:text-sky-300 px-2.5 py-1 rounded-full text-[11px] font-bold shrink-0">${offer.distance}</span>
                        </div>
                        
                        <div class="flex items-center gap-4 mt-2">
                            <div class="flex items-center gap-1 text-slate-400 dark:text-slate-500">
                                <span class="material-symbols-outlined text-sm" data-icon="location_on">location_on</span>
                                <span class="text-xs truncate max-w-[140px]">${offer.address.split(',')[0]}</span>
                            </div>
                            <div class="flex items-center gap-1 text-pink-500 font-bold text-xs bg-pink-50/50 dark:bg-pink-950/20 px-2 py-0.5 rounded-md">
                                <span class="material-symbols-outlined text-xs">payments</span>
                                <span>${offer.budget}</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    ${badgeHtml}
                    <div class="text-[11px] text-slate-400 dark:text-slate-500 font-semibold flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">shield</span> Confianza Protegida
                    </div>
                </div>
                
                <div class="mt-4 flex gap-3">
                    ${actionButtons}
                </div>
            </div>
        `;
    }

    // Go to the customized budget discussion chat
    function goToChat(id) {
        const offer = offers.find(o => o.id === id);
        if (offer) {
            showToast(`Conectando con ${offer.clientName} en chat de negociación segura...`);
            setTimeout(() => {
                window.location.href = offer.chatUrl;
            }, 600);
        }
    }

    // Route visual notification
    function showRoute(id) {
        const offer = offers.find(o => o.id === id);
        if (offer) {
            showToast(`Calculando ruta más rápida hacia la ubicación de ${offer.clientName}...`);
        }
    }

    // Boot execution
    document.addEventListener('DOMContentLoaded', () => {
        loadState();
        selectOffer(selectedOfferId);
    });
</script>
</body></html>
