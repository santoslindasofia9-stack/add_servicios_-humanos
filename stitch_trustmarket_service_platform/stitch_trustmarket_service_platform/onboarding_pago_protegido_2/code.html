<h1 class="font-h2 text-h2 text-on-surface tracking-tight">Tu Pago está Protegido</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-2">
                    Usamos tecnología de pago seguro para que tu dinero solo se libere cuando estés satisfecho
                </p>
</div>
