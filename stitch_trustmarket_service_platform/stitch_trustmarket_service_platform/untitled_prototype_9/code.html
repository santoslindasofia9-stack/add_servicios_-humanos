<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .shimmer-effect {
            background: linear-gradient(90deg, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.6) 50%, 
                rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .ethereal-gradient {
            background: linear-gradient(135deg, #E0F2FE 0%, #FCE4EC 100%);
        }

        .soft-pulse {
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.9; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex items-center justify-center min-h-screen">
<!-- Top Navigation Suppression: As per rules, splash screens exclude navigation shells -->
<main class="relative flex flex-col items-center justify-center w-full max-w-md px-10 text-center">
<!-- Logo Container -->
<div class="relative mb-12">
<!-- Ambient Glow -->
<div class="absolute inset-0 ethereal-gradient blur-3xl opacity-20 rounded-full scale-150"></div>
<!-- Central Icon Glyph -->
<div class="relative w-32 h-32 ethereal-gradient rounded-xl flex items-center justify-center shadow-[0_20px_50px_rgba(224,242,254,0.5)] overflow-hidden soft-pulse">
<!-- Inner Shimmer Layer -->
<div class="absolute inset-0 shimmer-effect"></div>
<!-- Icon -->
<span class="material-symbols-outlined text-white text-6xl font-light" data-icon="verified_user">
                    verified_user
                </span>
</div>
</div>
<!-- Branding Text -->
<div class="space-y-4">
<h1 class="font-plus-jakarta text-h1 text-on-background tracking-tighter">
                Marketplace de Confianza
            </h1>
<p class="font-plus-jakarta text-body-lg text-on-surface-variant font-medium opacity-60">
                Tu boutique segura para transacciones serenas.
            </p>
</div>
<!-- Minimal Loading Indicator -->
<div class="mt-24 w-48 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full w-1/3 ethereal-gradient rounded-full shimmer-effect"></div>
</div>
<!-- Aesthetic Footer Placeholder -->
<div class="fixed bottom-12 left-0 w-full flex flex-col items-center gap-2">
<div class="flex items-center gap-2 opacity-30">
<span class="material-symbols-outlined text-sm" data-icon="lock">lock</span>
<span class="text-label-caps font-plus-jakarta uppercase tracking-widest text-on-surface">End-to-End Encryption</span>
</div>
</div>
</main>
