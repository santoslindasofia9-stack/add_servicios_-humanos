<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#50616b",
                        "primary-container": "#e0f2fe",
                        surface: "#f8f9ff"
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8f9ff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .chat-container { height: calc(100vh - 180px); overflow-y: auto; padding-bottom: 120px; scrollbar-width: none; }
        .chat-container::-webkit-scrollbar { display: none; }
        .message-menu { display: none; position: absolute; top: 0; z-index: 50; }
        .message-item:hover .message-menu { display: flex; }
    </style>
</head>
<body class="bg-surface text-slate-900 overflow-hidden">
    <div class="flex h-screen overflow-hidden">
        <main class="flex-1 flex flex-col relative bg-[#F8FAFC]">
            <!-- Header (NO ICONS HERE) -->
            <header class="bg-white/80 backdrop-blur-md px-6 py-4 border-b border-sky-50 flex justify-between items-center shadow-sm">
                <div class="flex items-center gap-4">
                    <button class="hover:bg-gray-50 p-2 rounded-full transition-colors" onclick="window.history.back()"><span class="material-symbols-outlined text-slate-400">arrow_back</span></button>
                    <div class="flex items-center gap-3">
                        <img class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6LCpSD1P0zwjsHV158KmSAoVKwdnAsXoWRFdIkjwUf0uoY3Dvsp659wXUBdZMhos5rDbQ2XjCPP3YdmwPt3EKtU_6_4qSrJ6pxi8QWjivar8OYg1QsbQDVs7TPao5d_gsKDprBPUPruBGqSyR4cR0q-qA95lt2yAch8cqgqloqs5Lsh0DglXRftIOK4TKhLSKQ4JuqT0bw7Rwhnor_O6WO5U2HZxENXvmX6cgKoaK7bCwB2Poog8FGoVsiYAjmgjRA_rUJZynCQ" alt="Profile"/>
                        <div>
                            <h1 class="font-bold text-slate-900 text-sm">Sofia López</h1>
                            <p class="text-[10px] text-green-500 font-bold uppercase tracking-widest flex items-center gap-1">
                                <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> En línea
                            </p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button class="bg-[#FCE4EC] text-[#880E4F] px-5 py-2 rounded-full text-xs font-bold shadow-sm" onclick="window.location.href='../chat_negociaci_n_profesional_1/code.html'">Negociar</button>
                </div>
            </header>

            <div id="chat-messages" class="chat-container px-6 lg:px-24 py-8 space-y-8">
                <!-- Messages injected by JS -->
            </div>

            <!-- Bottom Area (NO PLUS ICON HERE) -->
            <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#F8FAFC] via-[#F8FAFC] to-transparent pt-12">
                    <div class="flex-1 relative">
                        <input id="message-input" type="text" class="w-full bg-white border border-gray-100 rounded-full px-8 py-4 text-sm font-medium focus:ring-4 focus:ring-blue-50 shadow-sm" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter') sendMessage()"/>
                    </div>
                    <button class="bg-[#FCE4EC] text-[#AD1457] w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-pink-100/50 hover:scale-105 active:scale-95 transition-all" onclick="sendMessage()">
                        <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">send</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-messages');

        // Read params from URL (passed from seguimiento de proyecto)
        const urlParams = new URLSearchParams(window.location.search);
        const fromTracking = urlParams.get('fromTracking') === '1';
        const incomingMsg = urlParams.get('msg') ? decodeURIComponent(urlParams.get('msg')) : null;

        let messages = [
            { id: 1, sender: 'expert', text: 'Hola, he revisado los detalles de tu proyecto. El alcance parece claro.', time: '14:22' },
            { id: 2, sender: 'me', text: 'Perfecto, ¿cómo afectaría eso al presupuesto final?', time: '14:25' },
            { id: 3, sender: 'expert', text: 'He actualizado la oferta con un incremento del 15% para cubrir las horas adicionales.', time: '14:30' },
            { id: 4, sender: 'expert', text: '¿Te parece bien si incluimos también el soporte post-entrega?', time: '14:31' },
            { id: 5, sender: 'me', text: 'Me parece razonable. Déjame consultarlo con el equipo.', time: '14:35' },
            { id: 6, sender: 'expert', text: '¡Claro! No hay prisa. Estaré atento a tu confirmación.', time: '14:40' },
            { id: 7, sender: 'me', text: 'Una duda más, ¿incluirías las fuentes originales en el entregable?', time: '14:45' },
            { id: 8, sender: 'expert', text: 'Por supuesto, se entregan todos los archivos fuente (AI, PSD) y los manuales.', time: '14:46' },
            { id: 9, sender: 'me', text: 'Genial. Creo que estamos listos para avanzar.', time: '14:50' },
            { id: 10, sender: 'expert', text: 'Perfecto. Acabo de enviar la propuesta actualizada para tu revisión.', time: '14:52' },
            { id: 11, sender: 'me', text: 'Muchas gracias por la aclaración.', time: '14:55' },
            { id: 12, sender: 'expert', text: '¡De nada! Cualquier otra duda me dices.', time: '14:56' }
        ];

        // If we came from seguimiento and have a message, append it as the latest expert message
        if (fromTracking && incomingMsg) {
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messages.push({ id: 'tracking-msg', sender: 'expert', text: incomingMsg, time: now, highlight: true });
        }

        function renderMessages() {
            // Date separator
            chatContainer.innerHTML = '<div class="flex justify-center sticky top-0 z-10 py-4"><span class="bg-white/80 backdrop-blur-md text-gray-400 text-[10px] font-black px-5 py-1.5 rounded-full uppercase tracking-widest shadow-sm border border-gray-50">Hoy</span></div>';

            // If came from tracking, show a context banner at top
            if (fromTracking && incomingMsg) {
                chatContainer.innerHTML += `
                    <div class="mx-auto max-w-[90%] bg-pink-50 border border-pink-100 rounded-2xl px-5 py-3 mb-4 flex items-start gap-3">
                        <span class="material-symbols-outlined text-pink-400 text-lg mt-0.5">info</span>
                        <div>
                            <p class="text-[10px] font-black text-pink-500 uppercase tracking-widest mb-0.5">Desde Seguimiento de Proyecto</p>
                            <p class="text-xs text-slate-600 font-medium">Sofía López te dejó un nuevo mensaje. Puedes responderle directamente aquí.</p>
                        </div>
                    </div>`;
            }

            messages.forEach(msg => {
                const isMe = msg.sender === 'me';
                const highlightClass = msg.highlight
                    ? 'ring-2 ring-pink-300 ring-offset-2 shadow-pink-100'
                    : '';
                chatContainer.innerHTML += `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'} group message-item relative">
                        <div class="max-w-[85%] lg:max-w-[70%] p-5 rounded-2xl shadow-sm border ${highlightClass} ${isMe ? 'bg-white text-gray-800 rounded-br-none border-[#FCE4EC]' : 'bg-blue-50/30 text-gray-800 rounded-bl-none border-blue-100'}">
                            ${msg.highlight ? '<p class="text-[9px] font-black text-pink-500 uppercase tracking-widest mb-2 flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">notifications_active</span> Nuevo mensaje desde Seguimiento</p>' : ''}
                            <p class="text-[15px] leading-relaxed">${msg.text}</p>
                            <div class="flex items-center gap-1 mt-3 opacity-30 text-[10px] font-bold ${isMe ? 'justify-end' : ''}">
                                <span>${msg.time}</span>
                                ${isMe ? '<span class="material-symbols-outlined text-[12px] text-blue-400">done_all</span>' : ''}
                            </div>
                            <!-- Delete Button -->
                            <div class="message-menu ${isMe ? '-left-12' : '-right-12'}">
                                <button onclick="deleteMsg('${msg.id}')" class="p-2 bg-white border border-gray-100 rounded-full text-gray-400 hover:text-red-500 shadow-sm transition-all" title="Eliminar"><span class="material-symbols-outlined text-sm">delete</span></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input.value.trim()) return;
            const newId = String(Date.now() + Math.random());
            messages.push({ id: newId, sender: 'me', text: input.value, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            input.value = '';
            renderMessages();
        }

        function deleteMsg(id) {
            messages = messages.filter(m => String(m.id) !== String(id));
            renderMessages();
        }

        renderMessages();

        // Auto-focus the input if coming from tracking
        if (fromTracking) {
            setTimeout(() => {
                const input = document.getElementById('message-input');
                if (input) { input.focus(); input.placeholder = 'Responde a Sofía...'; }
            }, 300);
        }
    </script>
</body>
</html>
