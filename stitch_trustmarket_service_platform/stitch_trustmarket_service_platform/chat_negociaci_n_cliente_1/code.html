<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#50616b",
                        "primary-container": "#e0f2fe",
                        "secondary-container": "#f4dce4",
                        surface: "#f8f9ff"
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        lg: "1.5rem",
                        xl: "3rem"
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .chat-container { height: calc(100vh - 180px); overflow-y: auto; padding-bottom: 100px; }
        .message-menu { display: none; }
        .message-item:hover .message-menu { display: flex; }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">
    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md fixed top-0 w-full z-50 px-6 py-4 border-b border-sky-50 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <button class="hover:bg-gray-50 p-2 rounded-full transition-colors"><span class="material-symbols-outlined">arrow_back</span></button>
            <div class="flex items-center gap-3">
                <img class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6LCpSD1P0zwjsHV158KmSAoVKwdnAsXoWRFdIkjwUf0uoY3Dvsp659wXUBdZMhos5rDbQ2XjCPP3YdmwPt3EKtU_6_4qSrJ6pxi8QWjivar8OYg1QsbQDVs7TPao5d_gsKDprBPUPruBGqSyR4cR0q-qA95lt2yAch8cqgqloqs5Lsh0DglXRftIOK4TKhLSKQ4JuqT0bw7Rwhnor_O6WO5U2HZxENXvmX6cgKoaK7bCwB2Poog8FGoVsiYAjmgjRA_rUJZynCQ" alt="Sofia"/>
                <div>
                    <h1 class="font-bold text-slate-900">Sofia López</h1>
                    <p class="text-[10px] text-green-500 font-bold uppercase tracking-widest flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> En línea
                    </p>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button class="bg-[#FCE4EC] text-[#880E4F] px-5 py-2 rounded-full text-xs font-bold shadow-sm hover:scale-105 transition-all" onclick="window.location.href='../chat_negociaci_n_profesional_1/code.html'">Negociar</button>
            <span class="material-symbols-outlined text-slate-400">more_vert</span>
        </div>
    </header>

    <main class="pt-20">
        <!-- Sidebar lateral (Desktop) -->
        <aside class="fixed right-0 top-20 bottom-0 w-80 bg-white border-l border-sky-50 p-6 hidden lg:block overflow-y-auto">
            <div class="bg-blue-50/30 rounded-2xl p-6 border border-blue-100/50 mb-6">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Oferta Actual</span>
                <h2 class="text-3xl font-black text-slate-900 mt-2">$1,250.00</h2>
                <div class="mt-6 flex flex-col gap-2">
                    <button class="w-full py-3 bg-[#FCE4EC] text-[#880E4F] font-bold rounded-full text-sm">Aceptar Propuesta</button>
                    <button class="w-full py-3 border border-blue-100 text-blue-600 font-bold rounded-full text-sm hover:bg-blue-50 transition-colors" onclick="window.location.href='../chat_negociaci_n_profesional_1/code.html'">Contraofertar</button>
                </div>
            </div>
            <div class="space-y-4">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Detalles del Proyecto</h3>
                <div class="flex items-center gap-3 text-sm text-slate-600">
                    <span class="material-symbols-outlined text-blue-400">calendar_month</span>
                    <span>Entrega: 4 semanas</span>
                </div>
                <div class="flex items-center gap-3 text-sm text-slate-600">
                    <span class="material-symbols-outlined text-blue-400">verified_user</span>
                    <span>Soporte incluido</span>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <div id="chat-messages" class="chat-container lg:mr-80 px-4 md:px-12 py-8 space-y-6">
            <!-- Messages injected by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 left-0 right-0 lg:mr-80 bg-white p-4 lg:p-6 border-t border-sky-50 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center gap-4">
            <button class="text-slate-400 hover:text-blue-500"><span class="material-symbols-outlined">add_circle</span></button>
            <div class="flex-1 relative">
                <input id="message-input" type="text" class="w-full bg-slate-50 border-none rounded-full px-6 py-3 text-sm focus:ring-2 focus:ring-blue-100" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter') sendMessage()"/>
                <button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300"><span class="material-symbols-outlined">sentiment_satisfied</span></button>
            </div>
            <button class="bg-[#FCE4EC] text-[#880E4F] w-12 h-12 rounded-full flex items-center justify-center shadow-md hover:scale-110 active:scale-95 transition-all" onclick="sendMessage()">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-messages');
        let messages = [
            { id: 1, sender: 'expert', text: 'Hola, he revisado los detalles de tu proyecto. El alcance parece claro.', time: '14:22' },
            { id: 2, sender: 'me', text: 'Perfecto, ¿cómo afectaría eso al presupuesto final?', time: '14:25' },
            { id: 3, sender: 'expert', text: 'He actualizado la oferta con un incremento del 15% para cubrir las horas adicionales.', time: '14:30' },
            { id: 4, sender: 'expert', text: '¿Te parece bien si incluimos también el soporte post-entrega?', time: '14:31' },
            { id: 5, sender: 'me', text: 'Me parece razonable. Déjame consultarlo con el equipo.', time: '14:35' },
            { id: 6, sender: 'expert', text: '¡Claro! No hay prisa. Estaré atento a tu confirmación.', time: '14:40' },
            { id: 7, sender: 'me', text: 'Una duda más, ¿incluirías las fuentes originales en el entregable?', time: '14:45' },
            { id: 8, sender: 'expert', text: 'Por supuesto, se entregan todos los archivos fuente (AI, PSD) y los manuales.', time: '14:46' },
            { id: 9, sender: 'me', text: 'Genial. Creo que estamos listos para avanzar.', time: '14:50' },
            { id: 10, sender: 'expert', text: 'Perfecto. Acabo de enviar la propuesta actualizada para tu revisión.', time: '14:52' }
        ];

        function renderMessages() {
            chatContainer.innerHTML = '';
            messages.forEach(msg => {
                const isMe = msg.sender === 'me';
                chatContainer.innerHTML += `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'} message-item relative group">
                        <div class="max-w-[85%] lg:max-w-[70%] p-4 rounded-2xl shadow-sm border ${isMe ? 'bg-white border-[#FCE4EC] rounded-br-none' : 'bg-blue-50/50 border-blue-100 rounded-bl-none'}">
                            <p class="text-[15px] leading-relaxed ${msg.deleted ? 'opacity-40 italic' : ''}">${msg.text}</p>
                            <div class="flex items-center gap-1 mt-2 opacity-30 text-[10px] font-bold ${isMe ? 'justify-end' : ''}">
                                <span>${msg.time}</span>
                                ${isMe ? '<span class="material-symbols-outlined text-[12px] text-blue-400">done_all</span>' : ''}
                            </div>
                            
                            <!-- Context Menu -->
                            <div class="message-menu absolute top-0 ${isMe ? '-left-10' : '-right-10'} flex flex-col gap-2">
                                <button onclick="toggleMenu(${msg.id})" class="p-1.5 bg-white border border-gray-100 rounded-full text-gray-300 hover:text-red-400 shadow-sm transition-all">
                                    <span class="material-symbols-outlined text-sm">close</span>
                                </button>
                            </div>

                            <div id="menu-${msg.id}" class="hidden absolute top-10 ${isMe ? 'right-0' : 'left-0'} bg-white border border-gray-100 rounded-xl shadow-xl p-1 min-w-[140px] z-50">
                                <button onclick="deleteMsg(${msg.id}, 'me')" class="w-full text-left px-3 py-2 text-[11px] font-bold text-gray-600 hover:bg-gray-50 rounded-lg transition-colors">Eliminar para mí</button>
                                <button onclick="deleteMsg(${msg.id}, 'all')" class="w-full text-left px-3 py-2 text-[11px] font-bold text-red-500 hover:bg-red-50 rounded-lg transition-colors">Eliminar para todos</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input.value.trim()) return;
            messages.push({
                id: Date.now(),
                sender: 'me',
                text: input.value,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            input.value = '';
            renderMessages();
        }

        function toggleMenu(id) {
            const menu = document.getElementById(`menu-${id}`);
            const allMenus = document.querySelectorAll('[id^="menu-"]');
            allMenus.forEach(m => { if(m.id !== `menu-${id}`) m.classList.add('hidden') });
            menu.classList.toggle('hidden');
        }

        function deleteMsg(id, mode) {
            if (mode === 'all') {
                messages = messages.map(m => m.id === id ? { ...m, text: '🚫 Este mensaje fue eliminado', deleted: true } : m);
            } else {
                messages = messages.filter(m => m.id !== id);
            }
            renderMessages();
        }

        renderMessages();
    </script>
</body>
</html>
