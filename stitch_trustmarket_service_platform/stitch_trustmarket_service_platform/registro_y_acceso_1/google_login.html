            <!-- Cuenta 1 -->

            <!-- Cuenta 4 -->

            <div class="flex gap-4">

    <script>
        function handleAccountSelect() {
            const selectedRole = localStorage.getItem('selectedRole') || 'client';
            
            // Simular carga de 1 segundo
            setTimeout(() => {
                if (selectedRole === 'client') {
                    window.location.href = '../home_marketplace_de_confianza_2/code.html';
                } else {
                    window.location.href = '../perfil_y_editor_de_servicios_2/code.html';
                }
            }, 800);
        }
    </script>
